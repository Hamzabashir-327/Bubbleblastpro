<style>
@font-face{font-family:"Poppins";font-weight:700;src:url(__FONT__) format("truetype");font-display:swap}
@font-face{font-family:"Poppins";font-weight:500;src:url(__FONTM__) format("truetype");font-display:swap}
:root{
  --page:#dff3ff; --ink:#fff; --muted:#d8ecff; --navy:#0b2a78; --navy2:#071c58;
  --orange:#ff8f1f; --green:#2fd36b; --blue:#2f8cff; --pink:#ff4f8b; --gold:#ffc82e; --slate:#6a7fb0; --violet:#8d5cff;
}

  background:#1d5e2c url(__BG1__) center/cover}

.fb{position:absolute;bottom:-14%;border-radius:50%;width:var(--s);height:var(--s);left:var(--x);opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--d);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,.2) 20%,color-mix(in srgb,var(--c) 38%,transparent) 62%,rgba(255,255,255,.4) 97%);
  box-shadow:inset 0 -8px 14px rgba(255,255,255,.2),0 0 16px rgba(255,255,255,.25)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:.85}92%{opacity:.85}100%{transform:translate(var(--dx),-125dvh);opacity:0}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:5% 6% 4%;z-index:2}

.logo{width:92%;max-width:560px;margin-top:3%;filter:drop-shadow(0 10px 14px rgba(0,30,110,.55));animation:sway 3.4s ease-in-out infinite,pop .8s cubic-bezier(.2,1.5,.4,1) both}

  background:var(--b);background:linear-gradient(180deg,color-mix(in srgb,var(--b) 55%,#fff) 0%,var(--b) 50%,color-mix(in srgb,var(--b) 86%,#000) 100%);
  box-shadow:0 6px 0 rgba(8,30,100,.6),0 14px 18px rgba(0,25,90,.4),inset 0 3px 0 rgba(255,255,255,.55);
  text-shadow:2px 0 var(--o),-2px 0 var(--o),0 2px var(--o),0 -2px var(--o),2px 2px var(--o),-2px -2px var(--o),2px -2px var(--o),-2px 2px var(--o),0 4px 0 var(--o);transition:transform .08s,box-shadow .08s}

.btn:focus-visible,.node:focus-visible{outline:3px solid #fff;outline-offset:3px}

.btn.big{font-size:clamp(24px,8cqw,50px);padding:.62em 2em;animation:pulse 1.6s ease-in-out infinite}

.node .st{position:absolute;left:0;right:0;bottom:-8%;display:flex;justify-content:center;gap:1%}

#marker.move{transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1);animation:none}

#modal.on{display:flex}
.card{background:linear-gradient(180deg,#3fa24c,#175a2a);border:5px solid #fff;border-radius:34px;padding:5% 7% 6%;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:stretch;gap:2.8cqw;text-align:center;
  box-shadow:0 9px 0 rgba(8,30,100,.6),0 24px 40px rgba(0,20,80,.5),inset 0 3px 0 rgba(255,255,255,.35);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.card .ttl{align-self:center}

.card .big{color:#fff;font-size:clamp(24px,7.4cqw,44px);-webkit-text-stroke:6px #0b2a78;paint-order:stroke fill;text-shadow:0 4px 0 rgba(8,30,100,.5)}
.card .btn.big{animation:none}
.stars{display:flex;justify-content:center;gap:2%}.stars img{width:20%;max-width:96px;opacity:.35;transform:scale(.8)}
.stars img.on{opacity:1;transform:scale(1);filter:drop-shadow(0 0 12px rgba(255,220,60,.95));transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.bar{width:80%;height:min(6cqw,34px);border-radius:99px;background:rgba(6,30,100,.7);border:4px solid #fff;overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,20,80,.6)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#ffe066,#ff9f1c);box-shadow:0 0 14px rgba(255,200,60,.9);animation:fill 5s cubic-bezier(.45,.05,.4,1) forwards}
.tip{margin:3% 0 0;min-height:2.6em;font-weight:500;font-size:clamp(13px,4cqw,22px);color:#fff;text-align:center;text-shadow:0 2px 0 rgba(0,25,90,.7)}
@media (prefers-reduced-motion: reduce){
  .fb,.logo,.btn.big,.btn::after,.badge,.node.current,.halo,#marker{animation:none!important} .fb{display:none}
  .node,.card,.pop{animation:none!important} .stars img.on{transition:none} #marker.move{transition:none}
}

<body>
<div class="stage" id="stage">
  <div id="fx" aria-hidden="true"></div>
  <canvas id="cv" aria-label="Bubble Blast game board"></canvas>
  <section class="screen on" id="splash" aria-live="polite">
    <img class="logo" src="__LOGO__" alt="Bubble Blast Pro - Mystic Worlds" style="margin-top:9%">
    <div class="bar pop" style="margin-top:10%;--d:.3s" role="progressbar" aria-label="Loading"><i></i></div>
    <p class="tip" id="tip">Mixing magic bubbles...</p>
    <div class="badge" style="margin-top:auto"><img src="__BADGE__" alt="Handcrafted with love by Hamza"></div>
  </section>
  <section class="screen" id="menu">
    <img class="logo" src="__LOGO__" alt="Bubble Blast Pro - Mystic Worlds">
    <p class="note pop" style="--d:.2s">Playable web preview of the Android game: same 30 levels, art and rules. Shop, daily reward and ads exist only in the Android build.</p>
    <div class="stack">
      <button class="btn green big pop" id="play" style="--d:.15s">PLAY</button>
      <div class="row pop" style="--d:.4s"><button class="btn blue small" id="sndbtn">Sound: on</button><button class="btn violet small" id="musbtn">Music: on</button></div>
    </div>
  </section>
  <section class="screen" id="levels">
    <div class="head"><button class="rbtn" id="back" aria-label="Back"><img src="__BACK__" alt=""></button><img class="ttl" src="__T_SELECT__" alt="Select level"><button class="btn gold small" id="unlock" aria-label="Unlock all levels (preview)"><img class="ic" src="__LOCKS__" alt="">Unlock</button></div>
    <div id="mapwrap"><div id="map"></div></div>
  </section>
  <div id="modal"><div class="card" id="card"></div></div>
</div>
<script>
"use strict";
const ASSETS = __ASSETS__;
const AUDIO = __AUDIO__;
const LEVELS = __LEVELS__;

/* ---------- board rules: JavaScript port of scripts/gameplay/board_logic.gd ---------- */
const COLS=10, MAXR=28, R=34, ROWH=R*Math.sqrt(3), STEP=17, CF=0.9, MAXSTEPS=600, NC=6;
const OX=20, OY=170, SHX=360, SHY=1050, W=720, H=1280, DANGER=940, LOSE_ROW=12;
const NORMAL=0, ICE=1, STONE=2, LOCKED=3, RESCUE=4;
const P_NORMAL=0, P_RAINBOW=1, P_BOMB=2, P_LIGHT=3, P_FIRE=4;
const rowCols=r=>r%2===0?COLS:COLS-1;
const inB=(c,r)=>r>=0&&r<MAXR&&c>=0&&c<rowCols(r);
const K=(c,r)=>r*16+c, UC=k=>k%16, UR=k=>Math.floor(k/16);
function nbrs(c,r){
  const cand=[[c-1,r],[c+1,r]];
  if(r%2===0)cand.push([c-1,r-1],[c,r-1],[c-1,r+1],[c,r+1]); else cand.push([c,r-1],[c+1,r-1],[c,r+1],[c+1,r+1]);
  return cand.filter(([a,b])=>inB(a,b));
}
let DROP=0, DROPV=0;
const cc=(c,r,d)=>[OX+R+(r%2?R:0)+2*R*c, OY+d+R+r*ROWH];
const center=(c,r)=>cc(c,r,DROPV), centerL=(c,r)=>cc(c,r,DROP);
let grid=new Map();
function loadRows(rows){
  grid=new Map();
  rows.forEach((line,r)=>{for(let c=0;c<line.length;c++){const ch=line[c];
    if(ch==='.')continue;
    if(ch>='0'&&ch<='5')grid.set(K(c,r),[+ch,NORMAL]);
    else if(ch>='a'&&ch<='f')grid.set(K(c,r),[ch.charCodeAt(0)-97,ICE]);
    else if(ch>='A'&&ch<='F')grid.set(K(c,r),[ch.charCodeAt(0)-65,LOCKED]);
    else if(ch==='#')grid.set(K(c,r),[-1,STONE]);
    else if(ch==='*')grid.set(K(c,r),[-1,RESCUE]);}});
}
const matchable=v=>v[1]===NORMAL||v[1]===ICE;
function colorsPresent(matchOnly=true){const s=new Set();for(const v of grid.values()){if(v[0]<0)continue;if(matchOnly&&!matchable(v))continue;s.add(v[0]);}return [...s].sort();}
const countColored=()=>{let n=0;for(const v of grid.values())if(v[0]>=0)n++;return n;};
const lowestRow=()=>{let m=-1;for(const k of grid.keys())m=Math.max(m,UR(k));return m;};
const hasNb=(c,r)=>nbrs(c,r).some(([a,b])=>grid.has(K(a,b)));
function collides(px,py){
  const rr=Math.floor((py-OY-DROP-R)/ROWH+0.5), thr=(2*R*CF)**2;
  for(let r=rr-1;r<=rr+1;r++){ if(r<0||r>=MAXR)continue;
    const bx=OX+R+(r%2?R:0), cc=Math.floor((px-bx)/(2*R)+0.5);
    for(let c=cc-1;c<=cc+1;c++){ if(c<0||c>=rowCols(r))continue;
      if(grid.has(K(c,r))){const cx=bx+2*R*c, cy=OY+DROP+R+r*ROWH; if((px-cx)**2+(py-cy)**2<thr)return true;}}}
  return false;
}
function traceShot(sx,sy,ddx,ddy){
  const mag=Math.hypot(ddx,ddy); let dx=ddx/mag, dy=ddy/mag;
  const minX=OX+R, maxX=OX+2*R*COLS-R, minY=OY+DROP+R; let px=sx, py=sy; const pts=[[px,py]]; let steps=0;
  while(steps<MAXSTEPS){ steps++;
    const nx=px+dx*STEP, ny=py+dy*STEP;
    if((nx<minX||nx>maxX)&&Math.abs(dx)>1e-9){const wx=nx<minX?minX:maxX, t=(wx-px)/dx, cy=py+dy*t; pts.push([wx,cy]); px=wx; py=cy; dx=-dx; continue;}
    const pry=py, prx=px; px=nx; py=ny;
    if(py<=minY){const tt=Math.abs(dy)>1e-9?(minY-pry)/dy:0; px=prx+dx*tt; py=minY; break;}
    if(collides(px,py))break;
  }
  pts.push([px,py]); return {pts,end:[px,py]};
}
function landing(px,py){
  let best=null,bd=Infinity; const rr=Math.floor((py-OY-DROP-R)/ROWH+0.5);
  for(let r=Math.max(rr-2,0);r<Math.min(rr+3,MAXR);r++) for(let c=0;c<rowCols(r);c++){
    if(grid.has(K(c,r)))continue; if(r>0&&!hasNb(c,r))continue;
    const [cx,cy]=centerL(c,r), d=(cx-px)**2+(cy-py)**2; if(d<bd){bd=d;best=[c,r];}}
  return best;
}
function traceFire(sx,sy,ddx,ddy){
  const mag=Math.hypot(ddx,ddy); let dx=ddx/mag, dy=ddy/mag;
  const minX=OX+R, maxX=OX+2*R*COLS-R, minY=OY+DROP+R; let px=sx, py=sy; const pts=[[px,py]], destroyed=[], hit=new Set(); let steps=0; const lim=(1.5*R)**2;
  while(steps<MAXSTEPS&&destroyed.length<6){ steps++;
    const nx=px+dx*STEP, ny=py+dy*STEP;
    if((nx<minX||nx>maxX)&&Math.abs(dx)>1e-9){const wx=nx<minX?minX:maxX,t=(wx-px)/dx,cy=py+dy*t;pts.push([wx,cy]);px=wx;py=cy;dx=-dx;continue;}
    px=nx;py=ny; if(py<=minY){py=minY;break;}
    const rr=Math.floor((py-OY-DROP-R)/ROWH+0.5);
    for(let r=rr-1;r<=rr+1;r++){ if(r<0||r>=MAXR)continue; for(let c=0;c<rowCols(r);c++){ const k=K(c,r);
      if(grid.has(k)&&!hit.has(k)){const [cx,cy]=centerL(c,r); if((px-cx)**2+(py-cy)**2<lim&&destroyed.length<6){hit.add(k);destroyed.push(k);}}}}
  }
  pts.push([px,py]); return {pts,end:[px,py],destroyed};
}
const newRes=()=>({landed:false,cell:null,popped:[],dropped:[],cracked:[],unlocked:[],freed:[],rescued:0,popN:0,dropN:0,score:0});
function rm(k,list){const v=grid.get(k);grid.delete(k);list.push({k,color:v[0],kind:v[1]});}
function findGroup(k0){
  const col=grid.get(k0)[0], seen=new Set([k0]), q=[k0], out=[];
  while(q.length){const k=q.pop();out.push(k); for(const [a,b] of nbrs(UC(k),UR(k))){const nk=K(a,b); if(seen.has(nk)||!grid.has(nk))continue; const v=grid.get(nk); if(matchable(v)&&v[0]===col){seen.add(nk);q.push(nk);}}}
  return out;
}
function afterRemoval(removed,res){
  for(const k of removed) for(const [a,b] of nbrs(UC(k),UR(k))){const nk=K(a,b); if(!grid.has(nk))continue; const v=grid.get(nk);
    if(v[1]===LOCKED){grid.set(nk,[v[0],NORMAL]);res.unlocked.push(nk);} else if(v[1]===RESCUE){rm(nk,res.freed);res.rescued++;}}
  dropFloating(res);
}
function dropFloating(res){
  const seen=new Set(), q=[]; for(let c=0;c<COLS;c++){const k=K(c,0); if(grid.has(k)){seen.add(k);q.push(k);}}
  while(q.length){const k=q.pop(); for(const [a,b] of nbrs(UC(k),UR(k))){const nk=K(a,b); if(grid.has(nk)&&!seen.has(nk)){seen.add(nk);q.push(nk);}}}
  for(const k of [...grid.keys()]) if(!seen.has(k)){const v=grid.get(k); rm(k,res.dropped); if(v[1]===RESCUE)res.rescued++;}
}
function finishScore(res){
  const rd=res.dropped.filter(d=>d.kind===RESCUE).length;
  res.popN=res.popped.length; res.dropN=res.dropped.length-rd; res.score=res.popN*10+res.dropN*20+res.rescued*100; return res;
}
function pickRainbow(c,r){
  let bc=-1,bs=-1;
  for(let col=0;col<NC;col++){
    if(!nbrs(c,r).some(([a,b])=>{const v=grid.get(K(a,b));return v&&matchable(v)&&v[0]===col;}))continue;
    grid.set(K(c,r),[col,NORMAL]); const s=findGroup(K(c,r)).length; grid.delete(K(c,r)); if(s>bs){bs=s;bc=col;}
  }
  if(bc<0){const p=colorsPresent(true);bc=p.length?p[0]:0;} return bc;
}
function resolveLanding(cell,proj,color){
  const res=newRes(); res.cell=cell; const [c,r]=cell, ck=K(c,r);
  if(proj===P_NORMAL||proj===P_RAINBOW){
    const col=proj===P_RAINBOW?pickRainbow(c,r):color; grid.set(ck,[col,NORMAL]);
    const g=findGroup(ck);
    if(g.length>=3){const removed=[]; for(const k of g){const v=grid.get(k); if(v[1]===ICE){grid.set(k,[v[0],NORMAL]);res.cracked.push(k);} else {rm(k,res.popped);removed.push(k);}} afterRemoval(removed,res);}
    else res.landed=true;

    const seen=new Set([ck]); let layer=[[c,r]];
    for(let d=0;d<2;d++){const nxt=[]; for(const [a,b] of layer) for(const [x,y] of nbrs(a,b)){const k=K(x,y); if(!seen.has(k)){seen.add(k);nxt.push([x,y]);}} layer=nxt;}
    const removed=[]; for(const k of seen) if(grid.has(k)){rm(k,res.popped);removed.push(k);} afterRemoval(removed,res);
  } else if(proj===P_LIGHT){
    const ix=R+(r%2?R:0)+2*R*c, iy=R+r*ROWH; const pos=k=>{const cc=UC(k),rr=UR(k);return [R+(rr%2?R:0)+2*R*cc,R+rr*ROWH];};
    const less=(a,b)=>{const pa=pos(a),pb=pos(b),da=(pa[0]-ix)**2+(pa[1]-iy)**2,db=(pb[0]-ix)**2+(pb[1]-iy)**2; if(Math.abs(da-db)>1e-6)return da<db; if(UR(a)!==UR(b))return UR(a)<UR(b); return UC(a)<UC(b);};

    while(chain.length<8&&cands.length){let bi=0; for(let i=1;i<cands.length;i++) if(less(cands[i],cands[bi]))bi=i;

}
function resolveFire(keys){

function startLevel(id){

function show(w){for(const id of ['splash','menu','levels'])$(id).classList.toggle('on',id===w);}
const say=(t,s=2.2)=>{G.toast={t,left:s};};
const roomPx=()=>{const low=lowestRow(); return low<0?9999:DANGER-(OY+G.drop+2*R+low*ROWH);};

function powerStatus(p){ if(G.uses[p.id]>=p.limit)return 'limit'; if(G.cd[p.id]>0)return 'cooldown'; return ''; }
function usePower(i){
  if(!G||modalOpen||G.state!=='aim')return; const p=POW[i], st=powerStatus(p);
  if(st==='limit'){say(p.name+': limit reached for this level');return;}
  if(st==='cooldown'){say(p.name+' recharging: '+G.cd[p.id]+' more shot(s)');return;}
  if(p.kind==='shot'){ if(G.armed===p.id){G.armed=null;G.cur.proj=0;} else {G.armed=p.id;G.cur.proj=p.proj;sfx('power');say(p.name+' ready - aim and shoot!',1.8);} }
  else if(p.id==='color_switch'){const pr=colorsPresent(true); if(pr.length<2){say('No other colour on the board');return;}

function fire(dx,dy){

  const proj=G.cur.proj, color=G.cur.color; let tr;
  if(proj===P_FIRE){tr=traceFire(SHX,SHY,dx,dy);G.destroyed=tr.destroyed;G.pcell=null;}
  else{tr=traceShot(SHX,SHY,dx,dy);G.pcell=landing(tr.end[0],tr.end[1]);}
  if(proj!==P_FIRE&&!G.pcell){say('No room to place that shot');return;}
  G.fired++; for(const p of POW) if(G.cd[p.id]>0)G.cd[p.id]--;
  if(G.armed){const p=POW.find(x=>x.id===G.armed);G.uses[p.id]++;G.cd[p.id]=p.cd;G.armed=null;}
  G.pk={proj,color}; G.cur.proj=0; G.path=tr.pts; G.seg=0; G.pos=[...tr.pts[0]]; G.state='fly'; sfx('shoot');
}
function landed(){
  const k=G.pk; const res=k.proj===P_FIRE?resolveFire(G.destroyed):resolveLanding(G.pcell,k.proj,k.color);
  G.state='resolve';
  const prog=res.popN+res.dropN+res.rescued>0; G.combo=prog?G.combo+1:0;
  const mult=1+0.5*Math.min(Math.max(G.combo-1,0),6), gain=Math.floor(res.score*mult);
  G.score+=gain; G.rescued+=res.rescued;
  G.drop+=G.ds.shot+(prog?0:G.ds.miss); DROP=G.drop;   // ceiling sinks: a little every shot, more after a miss
  if(res.cell){const ic=centerL(res.cell[0],res.cell[1]); const around=[...nbrs(res.cell[0],res.cell[1])]; for(const p of res.popped)for(const q of nbrs(UC(p.k),UR(p.k)))around.push(q);
    for(const [a2,b2] of around){const nk=K(a2,b2); if(!grid.has(nk))continue; const c2=centerL(a2,b2); let dx=c2[0]-ic[0],dy=c2[1]-ic[1]; const m=Math.hypot(dx,dy)||1; G.wob[nk]={t:0,dx:dx/m,dy:dy/m};}}
  if(res.popN>=3){const w=res.popN>=10?'AWESOME!':res.popN>=7?'GREAT!':res.popN>=5?'NICE!':(G.combo>=3?'COMBO x'+G.combo:''); if(w)G.words.push({s:w,t:0});}
  if(res.popN>=8||k.proj===P_BOMB||k.proj===P_LIGHT||k.proj===P_FIRE)G.shake=.25;
  let delay=0,cx=0,cy=0,n=0;

  let dd=0.12; for(const p of res.dropped){const [x,y]=center(UC(p.k),UR(p.k)); G.falls.push({x,y,vx:(Math.random()-.5)*180,vy:-60-Math.random()*200,color:p.color,kind:p.kind,t:-dd}); if(p.kind===RESCUE)G.texts.push({x,y,s:'Rescued!',t:-dd}); cx+=x;cy+=y;n++; dd+=0.02;}

  for(const k2 of res.unlocked){const [x,y]=center(UC(k2),UR(k2)); G.flashes.push({x,y,t:0,kind:'unlock'});}
  if(res.landed){const [x,y]=center(res.cell[0],res.cell[1]); G.flashes.push({x,y,t:0,kind:'land'});}
  if(gain>0){const x=n?cx/n:G.pos[0], y=n?cy/n:G.pos[1]; G.texts.push({x,y,s:'+'+gain+(G.combo>1?'  x'+mult.toFixed(1):''),t:0});}

function afterResolve(){

/* ---------- level map: sandy road over the three worlds, marker hops to the next level ---------- */
const MAP_W=600, GAP=128, MARG=170, WORLDS=['Green Jungle','Autumn Canopy','Glow Forest'];
function nodePos(i,n){ const x=300+Math.sin(i*0.9)*180, y=(n*GAP+MARG*2)-MARG-(i-1)*GAP; return [x,y]; }
function buildMap(fromLevel){
  const n=LEVELS.length, mh=n*GAP+MARG*2, un=unlockedMax(), map=$('map'); map.style.aspectRatio=MAP_W+'/'+mh;
  const P=[]; for(let i=1;i<=n;i++)P.push(nodePos(i,n));
  const curve=(pts)=>{let d='M'+pts[0][0]+' '+pts[0][1]; for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
      d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`;} return d;};
  const reached=P.slice(0,Math.min(un,n));
  let html=`<div class="mbg" style="bottom:0;height:34%;background-image:url(${ASSETS.bg1})"></div><div class="mbg" style="bottom:33.5%;height:33.5%;background-image:url(${ASSETS.bg2})"></div><div class="mbg" style="top:0;height:33.5%;background-image:url(${ASSETS.bg3})"></div>
    <svg viewBox="0 0 ${MAP_W} ${mh}" aria-hidden="true">
    <path d="${curve(P)}" fill="none" stroke="rgba(0,25,5,.38)" stroke-width="66" stroke-linecap="round" transform="translate(0 8)"/>
    <path d="${curve(P)}" fill="none" stroke="#5a3414" stroke-width="58" stroke-linecap="round"/>
    <path d="${curve(P)}" fill="none" stroke="#e8c98a" stroke-width="52" stroke-linecap="round"/>
    <path d="${curve(P)}" fill="none" stroke="#c98a45" stroke-width="44" stroke-linecap="round"/>
    <path d="${curve(P)}" fill="none" stroke="#8a5526" stroke-width="44" stroke-dasharray="3 15"/>
    ${reached.length>1?`<path d="${curve(reached)}" fill="none" stroke="rgba(255,236,150,.55)" stroke-width="44" stroke-linecap="round"/><path d="${curve(reached)}" fill="none" stroke="#a8691f" stroke-width="44" stroke-dasharray="3 15"/>`:''}</svg>`;
  const pct=(p)=>`left:${(p[0]/MAP_W*100).toFixed(3)}%;top:${(p[1]/mh*100).toFixed(3)}%`;
  [1,11,21].forEach((lv,wi)=>{const p=P[lv-1]; html+=`<div class="wtag" style="top:${((p[1]+GAP*.62)/mh*100).toFixed(3)}%">WORLD ${wi+1} &middot; ${WORLDS[wi]}</div>`;});
  for(let i=1;i<=n;i++){const L=LEVELS[i-1], st=(progress[i]||{}).stars||0, cur=(i===un&&!progress[i]), locked=i>un;
    const img=locked?'node_locked':(L.boss?'node_boss':(st>0?'node_done':'node_open'));
    if(cur)html+=`<img class="halo" src="${ASSETS.node_halo}" alt="" style="${pct(P[i-1])}">`;
    html+=`<button class="node ${locked?'locked':''} ${L.boss?'boss':''} ${cur?'current':''}" style="${pct(P[i-1])};--i:${i}" data-id="${i}" ${locked?'disabled':''} aria-label="Level ${i}${locked?', locked':''}, ${st} stars"><img class="nb" src="${ASSETS[img]}" alt=""><span class="num">${i}</span>${(!locked&&st>0)?`<span class="st">${[0,1,2].map(k=>`<img src="${k<st?ASSETS.star_on:ASSETS.star_off}" alt="">`).join('')}</span>`:''}</button>`;}
  const startAt=Math.max(1,Math.min(n,fromLevel||un));
  html+=`<img id="marker" src="${ASSETS.marker}" alt="" style="${pct(P[startAt-1])}">`;
  map.innerHTML=html;
  map.querySelectorAll('.node:not(.locked)').forEach(b=>b.onclick=()=>{sfx('click');startLevel(+b.dataset.id);});
  const wrap=$('mapwrap'), target=Math.min(n,un);
  const scrollToLv=(lv,smooth)=>{const y=P[lv-1][1]/mh*map.offsetHeight; wrap.scrollTo({top:Math.max(0,y-wrap.clientHeight*.55),behavior:smooth?'smooth':'auto'});};
  scrollToLv(startAt,false);
  if(fromLevel&&target>fromLevel){   // just won: the marker travels along the road to the next level
    const mk=$('marker'); setTimeout(()=>{mk.classList.add('move'); mk.style.left=(P[target-1][0]/MAP_W*100)+'%'; mk.style.top=(P[target-1][1]/mh*100)+'%'; scrollToLv(target,true); sfx('click');
      setTimeout(()=>{mk.classList.remove('move');sfx('star');},950);},650);
  }
}

/* ---------- input ---------- */
function lp(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function updAim(x,y){let a=Math.atan2(-(y-SHY),x-SHX); const mn=12*Math.PI/180; a=Math.min(Math.max(a,mn),Math.PI-mn); G.ad=[Math.cos(a),-Math.sin(a)];
  G.prev=G.cur.proj===P_FIRE?traceFire(SHX,SHY,G.ad[0],G.ad[1]):traceShot(SHX,SHY,G.ad[0],G.ad[1]);}
const GAPX=(W-48-6*96)/5, btnX=i=>24+i*(96+GAPX);
cv.addEventListener('pointerdown',e=>{
  if(!G||modalOpen||G.state==='ended')return; const [x,y]=lp(e); startMusic();
  if(x>24&&x<104&&y>14&&y<94){pause();return;}
  if(y>1150&&y<1256){const i=Math.floor((x-24)/(96+GAPX)); if(i>=0&&i<6&&x<btnX(i)+96)usePower(i);return;}
  if(G.state!=='aim'||y<OY-10||y>1145)return;
  cv.setPointerCapture(e.pointerId); G.aim=true; G.press=[x,y]; G.swapC=Math.hypot(x-SHX,y-SHY)<80; updAim(x,y);
});
cv.addEventListener('pointermove',e=>{if(G&&G.aim){const [x,y]=lp(e);updAim(x,y);}});
cv.addEventListener('pointerup',e=>{
  if(!G||!G.aim)return; const [x,y]=lp(e); G.aim=false; G.prev=null;
  if(G.state!=='aim'||modalOpen)return;
  if(G.swapC&&Math.hypot(x-SHX,y-SHY)<80&&Math.hypot(x-G.press[0],y-G.press[1])<30){
    if(G.cur.proj!==0)say('Fire your power-up first!'); else {const t=G.cur.color;G.cur.color=G.next;G.next=t;sfx('click');}
  } else if(y<=1145)fire(G.ad[0],G.ad[1]);
});
cv.addEventListener('pointercancel',()=>{if(G){G.aim=false;G.prev=null;}});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000); last=now; if(G&&!modalOpen)update(dt); draw(); requestAnimationFrame(frame);}
function update(dt){
  G.t+=dt;
  if(DROPV<G.drop)DROPV=Math.min(G.drop,DROPV+90*dt); else if(DROPV>G.drop)DROPV=Math.max(G.drop,DROPV-240*dt);
  if(G.state!=='ended'&&G.L.time_limit){ if(G.freeze>0)G.freeze=Math.max(0,G.freeze-dt); else G.timeLeft=Math.max(0,G.timeLeft-dt);
    if(G.timeLeft<=0){ if(G.state==='aim')lose('time'); else G.timeUp=true; } }
  if(G.state==='fly'){
    let mv=2100*dt; while(mv>0&&G.seg<G.path.length-1){const t=G.path[G.seg+1], dx=t[0]-G.pos[0], dy=t[1]-G.pos[1], d=Math.hypot(dx,dy);
      if(d<=mv){G.pos=[...t];mv-=d;G.seg++; if(G.seg<G.path.length-1)sfx('bounce');} else {G.pos[0]+=dx/d*mv;G.pos[1]+=dy/d*mv;mv=0;}}
    if(G.seg>=G.path.length-1)landed();
  }
  for(const e of G.pops)e.t+=dt; G.pops=G.pops.filter(e=>e.t<0.28);
  for(const e of G.falls){e.t+=dt; if(e.t>0){e.vy+=2600*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;}} G.falls=G.falls.filter(e=>e.t<0.9&&e.y<H+100);
  for(const e of G.parts){e.t+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=700*dt;} G.parts=G.parts.filter(e=>e.t<e.max);
  for(const e of G.texts)e.t+=dt; G.texts=G.texts.filter(e=>e.t<1);
  for(const e of G.flashes)e.t+=dt; G.flashes=G.flashes.filter(e=>e.t<0.3);
  if(G.toast){G.toast.left-=dt; if(G.toast.left<=0)G.toast=null;}
  for(const k in G.wob){G.wob[k].t+=dt; if(G.wob[k].t>.5)delete G.wob[k];}
  for(const w of G.words)w.t+=dt; G.words=G.words.filter(w=>w.t<1.1);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  if(G.state==='resolve'&&!G.pops.length&&!G.falls.length&&Math.abs(DROPV-G.drop)<0.5)afterResolve();
}

/* ---------- drawing (theme: Ocean Candy) ---------- */
function bub(x,y,color,kind,s=1,a=1){
  const r=R*s; ctx.globalAlpha=a*.3; ctx.fillStyle='#021a52'; ctx.beginPath(); ctx.ellipse(x+3,y+r*.8,r*.8,r*.3,0,0,6.283); ctx.fill(); ctx.globalAlpha=a;
  if(kind===STONE)ctx.drawImage(IM.stone,x-r,y-r,2*r,2*r);
  else if(kind===RESCUE)ctx.drawImage(IM.critter,x-r,y-r,2*r,2*r);
  else {ctx.drawImage(IM['bubble_'+color],x-r,y-r,2*r,2*r);
    if(kind===ICE)ctx.drawImage(IM.ice,x-r,y-r,2*r,2*r);
    if(kind===LOCKED){ctx.fillStyle='rgba(0,10,50,.45)';ctx.beginPath();ctx.arc(x,y,r*.94,0,6.283);ctx.fill();ctx.drawImage(IM.lock,x-r,y-r,2*r,2*r);}}
  ctx.globalAlpha=1;
}
function projBub(x,y,proj,color,s=1){const r=R*s,n=['','rainbow','bomb','lightning','fireball'][proj]; ctx.drawImage(n?IM[n]:IM['bubble_'+color],x-r,y-r,2*r,2*r);}
function navy(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(76,184,92,.92)');g.addColorStop(1,'rgba(14,84,42,.96)');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.roundRect(x+6,y+6,w-12,h*.38,r*.7);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fill();}
function stk(s,x,y,size,fill,al='center',a=1,stroke='#0d3b1c'){ctx.save();ctx.globalAlpha=a;ctx.font=`700 ${size}px Poppins,system-ui,sans-serif`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(4,size/3.2);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y);ctx.restore();}
function gtxt(s,x,y,size,c1,c2,al='center',a=1){ctx.save();ctx.globalAlpha=a;ctx.font=`700 ${size}px Poppins,system-ui,sans-serif`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(5,size/3.4);ctx.strokeStyle='#0d3b1c';ctx.strokeText(s,x,y+3);ctx.strokeText(s,x,y);const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillText(s,x,y);ctx.restore();}
function drawBridge(FW){
  const x0=OX-14, y0=OY-30, w=FW+28, h=DANGER-OY+64;
  ctx.save(); ctx.beginPath(); ctx.roundRect(x0,y0,w,h,20); ctx.clip();
  let y=y0, i=0;
  while(y<y0+h){ const ph=46;
    ctx.fillStyle=i%2?'#c98a45':'#dba65e'; ctx.fillRect(x0,y,w,ph);
    ctx.fillStyle='rgba(255,236,190,.22)'; ctx.fillRect(x0,y,w,5);
    ctx.fillStyle='rgba(60,28,6,.6)'; ctx.fillRect(x0,y+ph,w,6);
    ctx.strokeStyle='rgba(120,70,25,.38)'; ctx.lineWidth=2; ctx.beginPath(); const gy=y+15;
    ctx.moveTo(x0+30+(i*47)%120,gy); ctx.lineTo(x0+250+(i*61)%160,gy+2); ctx.moveTo(x0+400+(i*37)%90,gy+18); ctx.lineTo(x0+640,gy+20); ctx.stroke();
    ctx.fillStyle='rgba(50,24,6,.7)'; ctx.beginPath(); ctx.arc(x0+16,y+ph/2,3.2,0,6.283); ctx.arc(x0+w-16,y+ph/2,3.2,0,6.283); ctx.fill();
    y+=ph+6; i++; }
  const sh=ctx.createLinearGradient(0,y0,0,y0+h); sh.addColorStop(0,'rgba(255,240,200,.10)'); sh.addColorStop(1,'rgba(40,16,0,.24)'); ctx.fillStyle=sh; ctx.fillRect(x0,y0,w,h);
  ctx.restore();
  for(const rx of [x0-5,x0+w+5]){   // rope rails
    ctx.lineCap='round'; ctx.strokeStyle='#4a2a10'; ctx.lineWidth=15; ctx.beginPath(); ctx.moveTo(rx,y0-8); ctx.lineTo(rx,y0+h+8); ctx.stroke();
    ctx.strokeStyle='#ecd29a'; ctx.lineWidth=9; ctx.stroke(); ctx.strokeStyle='rgba(120,70,20,.55)'; ctx.setLineDash([5,9]); ctx.stroke(); ctx.setLineDash([]);
    for(let py=y0; py<=y0+h+1; py+=(h/6)){ ctx.fillStyle='#4a2a10'; ctx.beginPath(); ctx.roundRect(rx-15,py-26,30,52,9); ctx.fill(); ctx.fillStyle='#b9792f'; ctx.beginPath(); ctx.roundRect(rx-11,py-22,22,22,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.roundRect(rx-8,py-20,9,6,3); ctx.fill(); }
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!G)return;
  ctx.drawImage(IM['bg'+G.L.world],0,0,W,H);
  ctx.save(); if(G.shake>0){const m=G.shake/.25*7; ctx.translate((Math.random()-.5)*2*m,(Math.random()-.5)*2*m);}
  const FW=2*R*COLS;
  drawBridge(FW);
  // danger zone
  const room=roomPx(), hot=room<150, pa=hot?.65+.3*Math.sin(performance.now()/110):.55;
  const dg=ctx.createLinearGradient(0,DANGER-110,0,DANGER+30);dg.addColorStop(0,'rgba(255,50,70,0)');dg.addColorStop(1,`rgba(255,50,70,${hot?.45:.18})`);ctx.fillStyle=dg;ctx.fillRect(OX-6,DANGER-110,FW+12,140);
  ctx.strokeStyle=`rgba(255,70,90,${pa})`;ctx.lineWidth=6;ctx.setLineDash([22,12]);ctx.beginPath();ctx.moveTo(OX-6,DANGER);ctx.lineTo(OX+FW+6,DANGER);ctx.stroke();ctx.setLineDash([]);
  // bubbles (clipped to the deck)
  ctx.save();ctx.beginPath();ctx.roundRect(OX-10,OY-26,FW+20,DANGER-OY+58,18);ctx.clip();
  for(const [k,v] of grid){let [x,y]=center(UC(k),UR(k)); const w=G.wob[k]; if(w){const a=Math.exp(-w.t*8)*Math.sin(w.t*36)*8; x+=w.dx*a; y+=w.dy*a;} bub(x,y,v[0],v[1]);}
  for(const e of G.falls){ if(e.t>0)bub(e.x,e.y,e.color,e.kind,1,Math.max(0,1-e.t/0.9)); else bub(e.x,e.y,e.color,e.kind); }
  for(const e of G.pops){ if(e.t<0){bub(e.x,e.y,e.color,e.kind);continue;} const k=e.t/0.28;
    if(e.sp){ctx.fillStyle=`rgba(255,235,120,${.6*(1-k)})`;ctx.beginPath();ctx.arc(e.x,e.y,R*(1+1.2*k),0,6.283);ctx.fill();}
    else{bub(e.x,e.y,e.color,e.kind,1+.5*k,1-k);ctx.strokeStyle=`rgba(255,255,255,${.9*(1-k)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,R*(1+.9*k),0,6.283);ctx.stroke();}}
  ctx.restore();
  // sinking ceiling = a wooden beam (its lower edge is where new bubbles stick)
  const cy0=OY+DROPV-6; ctx.beginPath();ctx.roundRect(OX-16,cy0-30,FW+32,36,14);const cg=ctx.createLinearGradient(0,cy0-30,0,cy0+6);cg.addColorStop(0,'#c98a45');cg.addColorStop(.5,'#9a622c');cg.addColorStop(1,'#5b3416');ctx.fillStyle=cg;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#ecd29a';ctx.stroke();
  for(let i=0;i<5;i++){ctx.fillStyle='rgba(40,20,5,.55)';ctx.beginPath();ctx.arc(OX+60+i*140,cy0-12,5,0,6.283);ctx.fill();}
  for(const e of G.flashes){const k=e.t/.3; ctx.strokeStyle=e.kind==='unlock'?`rgba(255,217,77,${.9*(1-k)})`:e.kind==='land'?`rgba(255,255,255,${.55*(1-k)})`:`rgba(190,245,255,${.9*(1-k)})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,R*(.9+.7*k),0,6.283);ctx.stroke();}
  for(const e of G.parts){ctx.globalAlpha=1-e.t/e.max;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.sz*(1-e.t/e.max),0,6.283);ctx.fill();ctx.globalAlpha=1;}
  // aim guide: dots in the colour of the ball you are about to shoot, shrinking with distance
  if(G.aim&&G.prev&&G.state==='aim'){
    let trav=0,nd=20,di=0; const pts=G.prev.pts, dc=G.cur.proj===0?COLORS[G.cur.color]:'#ffffff';
    for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L<.001)continue; const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L;
      while(nd<=trav+L){const t=nd-trav, rr=Math.max(3.2,8.5-di*.11); ctx.beginPath();ctx.arc(a[0]+ux*t,a[1]+uy*t,rr,0,6.283);ctx.fillStyle=dc;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke(); nd+=27; di++;} trav+=L;}
    ctx.lineWidth=3;
    if(G.cur.proj===P_FIRE){ctx.strokeStyle='rgba(255,170,60,.95)';for(const k of G.prev.destroyed){const [x,y]=center(UC(k),UR(k));ctx.beginPath();ctx.arc(x,y,R*.95,0,6.283);ctx.stroke();}}
    else{const c=landing(G.prev.end[0],G.prev.end[1]); if(c){const [x,y]=centerL(c[0],c[1]);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x,y,R*.92,0,6.283);ctx.stroke();}}
  }
  // launcher: white ring on the bridge end; rows-left badge | current | swap | next (like the reference)
  const ad=G.ad||[0,-1];
  ctx.save();ctx.translate(SHX,SHY);ctx.rotate(Math.atan2(ad[1],ad[0])+Math.PI/2);ctx.fillStyle='rgba(255,255,255,.92)';ctx.strokeStyle='rgba(20,90,40,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-R*2.3);ctx.lineTo(16,-R*1.45);ctx.lineTo(-16,-R*1.45);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(SHX,SHY,R*1.6,0,6.283);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='rgba(10,60,28,.35)';ctx.beginPath();ctx.arc(SHX,SHY,R*1.2,0,6.283);ctx.fill();
  if(G.state==='aim')projBub(SHX,SHY,G.cur.proj,G.cur.color);
  const rows=Math.max(0,Math.floor(room/ROWH)), low=rows<=2;
  ctx.fillStyle=low?'#c81e3a':'#0f4d24';ctx.beginPath();ctx.arc(SHX-128,SHY,32,0,6.283);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke(); stk(String(rows),SHX-128,SHY-2,30,'#fff'); stk('ROWS',SHX-128,SHY+46,15,'#fff');
  ctx.globalAlpha=.95;ctx.drawImage(IM.swap,SHX+66,SHY-24,44,44);ctx.globalAlpha=1;
  projBub(SHX+140,SHY,0,G.next,.7); stk('NEXT',SHX+140,SHY+46,15,'#fff');
  if(G.state==='fly'){ if(G.pk.proj===P_FIRE){ctx.fillStyle='rgba(255,150,30,.3)';ctx.beginPath();ctx.arc(G.pos[0],G.pos[1],R*1.5,0,6.283);ctx.fill();} projBub(G.pos[0],G.pos[1],G.pk.proj,G.pk.color); }
  for(const e of G.texts){ if(e.t<0)continue; gtxt(e.s,e.x,e.y-60*e.t,38,'#fffbd0','#ffb020','center',1-e.t); }
  ctx.restore();
  for(const w of G.words){const k=Math.min(1,w.t*5), sz=70*(.55+.45*k)*(1+.06*Math.sin(w.t*14)); gtxt(w.s,360,520-w.t*40,sz,'#fffbd0','#ff8a1f','center',Math.min(1,(1.1-w.t)*2));}
  // ---- HUD (same arrangement as the reference): menu | star progress bar | score ----
  navy(24,14,76,76,22); ctx.fillStyle='#fff'; for(const yy of [38,52,66]){ctx.beginPath();ctx.roundRect(42,yy-4,40,8,4);ctx.fill();}
  const s0=G.L.star_scores[0], s1=G.L.star_scores[1], bx=122, by=28, bw=372, bh=40;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,20);ctx.fillStyle='rgba(6,48,22,.88)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  const fr=Math.min(1,G.score/s1); if(fr>0){ctx.save();ctx.beginPath();ctx.roundRect(bx+4,by+4,bw-8,bh-8,16);ctx.clip();const fg2=ctx.createLinearGradient(0,by,0,by+bh);fg2.addColorStop(0,'#ffe36a');fg2.addColorStop(1,'#ff9f1c');ctx.fillStyle=fg2;ctx.fillRect(bx+4,by+4,(bw-8)*fr,bh-8);ctx.restore();}
  [[.6*s0,.6*s0/s1],[s0,s0/s1],[s1,1]].forEach(([thr,pos])=>{const sx=bx+bw*Math.min(pos,.98)-8; ctx.globalAlpha=1; ctx.drawImage(G.score>=thr?IM.star_on:IM.star_off,sx-22,by-9,52,52);});
  stk(String(G.score),698,50,42,'#fff','right');
  stk('LEVEL '+G.id+(G.L.boss?'  BOSS':''),30,118,22,'#ffe27a','left');
  const o=G.L.objective; stk(o.type==='clear'?'Clear all: '+countColored()+' left':o.type==='score'?'Reach '+o.target+' pts':'Rescue '+G.rescued+' / '+o.target,360,118,21,'#fff');
  if(G.L.time_limit){const t=Math.max(0,Math.ceil(G.timeLeft)); stk(Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+(G.freeze>0?' FROZEN':''),698,118,22,G.freeze>0?'#9fe6ff':(t<=10?'#ff9fb4':'#ffe27a'),'right');}
  else stk('SHOTS '+G.fired,698,118,19,'#d8ffd8','right');
  // power dock
  navy(14,1138,692,126,34);
  POW.forEach((p,i)=>{const x=btnX(i),y=1154,st=powerStatus(p),armed=G.armed===p.id;
    if(armed){ctx.fillStyle='rgba(255,230,90,.7)';ctx.beginPath();ctx.roundRect(x-7,y-7,110,110,28);ctx.fill();}
    ctx.globalAlpha=st?.4:1; ctx.drawImage(IM['power_'+p.id],x,y,96,96); ctx.globalAlpha=1;
    const left=p.limit-G.uses[p.id]; ctx.fillStyle='#8d3dff';ctx.beginPath();ctx.arc(x+84,y+84,17,0,6.283);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke(); stk(st==='cooldown'?String(G.cd[p.id]):String(left),x+84,y+85,20,'#fff');
  });
  if(G.toast){const a=Math.min(1,G.toast.left/.4); ctx.globalAlpha=a; navy(46,DANGER-250,628,76,26); const t=G.toast.t; stk(t.length>46?t.slice(0,44)+'...':t,360,DANGER-212,22,'#fff','center',a); ctx.globalAlpha=1;}
}
requestAnimationFrame(frame);

/* ---------- decoration: floating glass bubbles, 5-second loading screen ---------- */
(function(){
  const fx=$('fx'); const cols=['#ec1c32','#ffcd00','#1cc43c','#1676ff','#ac34ff','#ff3ea8'];
  for(let i=0;i<16;i++){const b=document.createElement('div'); b.className='fb';
    b.style.cssText=`--s:${(5+Math.random()*9).toFixed(1)}cqw;--x:${(Math.random()*92).toFixed(0)}%;--c:${cols[i%6]};--t:${(11+Math.random()*12).toFixed(1)}s;--d:-${(Math.random()*20).toFixed(1)}s;--dx:${((Math.random()-.5)*14).toFixed(1)}cqw`;
    fx.appendChild(b);}
  const tips=['Mixing magic bubbles...','Polishing the stars...','Loading 30 mystic levels...','Warming up the bubble cannon...','Almost ready - get set to pop!'];
  let i=0; const tipEl=$('tip'); const iv=setInterval(()=>{i=Math.min(i+1,tips.length-1); tipEl.textContent=tips[i];},1000);
  setTimeout(()=>{clearInterval(iv); show('menu');},5000);
})();
